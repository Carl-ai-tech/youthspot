<title>YouthLens 資料預覽</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;600&display=swap">

<style>
:root {
  --paper:#F5F6F8; --card:#FFFFFF; --sunk:#ECEEF2;
  --ink:#171C24; --ink-2:#454F5E; --ink-3:#6E7887;
  --rule:#DCE0E7; --rule-soft:#E7EAEF;
  --accent:#2E63AE; --accent-soft:rgba(46,99,174,.10);
  --high:#2E63AE; --med:#C07A12; --low:#A93627; --none:#8A93A1;
  --on-accent:#FFFFFF;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --mono:"IBM Plex Mono",Consolas,monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper:#12161D; --card:#182029; --sunk:#1E2733;
    --ink:#E5E9EF; --ink-2:#AEB8C6; --ink-3:#808B9B;
    --rule:#2A3441; --rule-soft:#222B36;
    --accent:#4E8CDE; --accent-soft:rgba(78,140,222,.15);
    --high:#4E8CDE; --med:#BB8624; --low:#E07A6B; --none:#6B7686;
    --on-accent:#0E1219;
  }
}
:root[data-theme="dark"] {
  --paper:#12161D; --card:#182029; --sunk:#1E2733;
  --ink:#E5E9EF; --ink-2:#AEB8C6; --ink-3:#808B9B;
  --rule:#2A3441; --rule-soft:#222B36;
  --accent:#4E8CDE; --accent-soft:rgba(78,140,222,.15);
  --high:#4E8CDE; --med:#BB8624; --low:#E07A6B; --none:#6B7686;
  --on-accent:#0E1219;
}

* { box-sizing:border-box; }
body { margin:0; background:var(--paper); color:var(--ink); font-family:var(--sans); font-size:15px; line-height:1.7; }
.wrap { max-width:70rem; margin:0 auto; padding:0 1.25rem 5rem; }

/* ── 頁首 */
header { border-bottom:1px solid var(--rule); padding:2.2rem 0 1.2rem; margin-bottom:1.5rem; }
.kicker { font-family:var(--mono); font-size:.7rem; letter-spacing:.16em; text-transform:uppercase; color:var(--ink-3); margin:0 0 .5rem; }
h1 { font-size:1.55rem; font-weight:700; margin:0 0 .45rem; letter-spacing:-.01em; }
.sub { color:var(--ink-2); font-size:.92rem; margin:0; max-width:44rem; }
.srcline { font-family:var(--mono); font-size:.73rem; color:var(--ink-3); margin:.7rem 0 0; }
.srcline a { color:var(--accent); }

/* ── 篩選 */
.filters { display:flex; flex-wrap:wrap; gap:1.1rem 1.6rem; align-items:flex-end; margin-bottom:1.6rem; }
.field { display:flex; flex-direction:column; gap:.35rem; }
.field > label { font-family:var(--mono); font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-3); }
select {
  font-family:var(--sans); font-size:.95rem; color:var(--ink); background:var(--card);
  border:1px solid var(--rule); border-radius:3px; padding:.45rem .6rem; min-width:11rem;
}
select:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
.chips { display:flex; gap:.35rem; flex-wrap:wrap; }
.chip {
  font-family:var(--mono); font-size:.82rem; padding:.42rem .75rem; cursor:pointer;
  background:var(--card); color:var(--ink-2); border:1px solid var(--rule); border-radius:3px;
}
.chip[aria-pressed="true"] { background:var(--accent); color:var(--on-accent); border-color:var(--accent); font-weight:600; }
.chip:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }

/* ── 數字卡 */
.tiles { display:grid; grid-template-columns:repeat(auto-fit,minmax(13rem,1fr)); gap:1px; background:var(--rule); border:1px solid var(--rule); border-radius:3px; margin-bottom:2rem; }
.tile { background:var(--card); padding:1.05rem 1.15rem; cursor:pointer; text-align:left; border:0; font:inherit; color:inherit; }
.tile:hover, .tile:focus-visible { background:var(--accent-soft); outline:none; }
.tile-label { font-size:.8rem; color:var(--ink-3); display:flex; align-items:center; gap:.5rem; margin-bottom:.15rem; }
.tile-value { font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:1.85rem; font-weight:600; line-height:1.2; }
.tile-unit { font-size:.85rem; color:var(--ink-3); font-weight:400; margin-left:.25rem; }
.tile-hint { font-size:.72rem; color:var(--ink-3); margin-top:.3rem; }

/* ── 信心度標記 */
.pill { display:inline-flex; align-items:center; gap:.3rem; font-family:var(--mono); font-size:.66rem; letter-spacing:.04em; padding:.05rem .42rem; border-radius:9px; border:1px solid currentColor; white-space:nowrap; }
.pill::before { content:""; width:5px; height:5px; border-radius:50%; background:currentColor; }
.pill.high{color:var(--high)} .pill.medium{color:var(--med)} .pill.low{color:var(--low)} .pill.inferred{color:var(--none)}

/* ── 排行 */
section h2 { font-size:1.02rem; font-weight:700; margin:0 0 .2rem; }
section .hint { font-size:.82rem; color:var(--ink-3); margin:0 0 1rem; }
.ranks { display:flex; flex-direction:column; gap:2px; margin-bottom:2.2rem; }
.rank { display:grid; grid-template-columns:6.5rem 1fr 6rem; align-items:center; gap:.7rem; background:none; border:0; font:inherit; color:inherit; cursor:pointer; padding:.2rem .25rem; border-radius:2px; text-align:left; }
.rank:hover, .rank:focus-visible { background:var(--sunk); outline:none; }
.rank-name { font-size:.85rem; color:var(--ink-2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.rank-bar { height:16px; background:var(--sunk); border-radius:2px; overflow:hidden; }
.rank-fill { height:100%; background:var(--accent); border-radius:2px; }
.rank[data-current="1"] .rank-fill { background:var(--med); }
.rank[data-current="1"] .rank-name { color:var(--ink); font-weight:700; }
.rank-val { font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:.82rem; text-align:right; color:var(--ink-2); }

/* ── 表 */
.tablewrap { overflow-x:auto; border:1px solid var(--rule); border-radius:3px; background:var(--card); margin-bottom:2.2rem; }
table { border-collapse:collapse; width:100%; font-size:.87rem; min-width:34rem; }
th { font-family:var(--mono); font-size:.68rem; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-3); font-weight:400; text-align:left; padding:.6rem .85rem; border-bottom:1px solid var(--rule); white-space:nowrap; }
td { padding:.55rem .85rem; border-bottom:1px solid var(--rule-soft); }
tbody tr:last-child td { border-bottom:0; }
tbody tr { cursor:pointer; }
tbody tr:hover { background:var(--accent-soft); }
td.num { font-family:var(--mono); font-variant-numeric:tabular-nums; text-align:right; }

/* ── 履歷面板 */
.prov { border:1px solid var(--rule); border-left:3px solid var(--accent); border-radius:3px; background:var(--card); padding:1.1rem 1.25rem; }
.prov[hidden] { display:none; }
.prov h3 { font-size:.95rem; margin:0 0 .15rem; }
.prov .headline { font-family:var(--mono); font-size:1.15rem; font-weight:600; margin:0 0 .9rem; color:var(--accent); }
.prov dl { display:grid; grid-template-columns:auto 1fr; gap:.4rem 1.1rem; margin:0; font-size:.86rem; }
.prov dt { font-family:var(--mono); font-size:.7rem; letter-spacing:.06em; color:var(--ink-3); padding-top:.2rem; white-space:nowrap; }
.prov dd { margin:0; color:var(--ink-2); }
.prov dd.mono { font-family:var(--mono); font-variant-numeric:tabular-nums; }
.empty { color:var(--ink-3); font-size:.88rem; padding:.5rem 0; }
.scopenote { font-size:.8rem; color:var(--ink-3); margin:-1.3rem 0 2rem; }
.scopenote[hidden] { display:none; }

.foot { margin-top:2.5rem; padding-top:1.1rem; border-top:1px solid var(--rule); font-size:.78rem; color:var(--ink-3); }
.foot code { font-family:var(--mono); background:var(--sunk); padding:.08em .35em; border-radius:2px; }
</style>

<div class="wrap">
<header>
  <p class="kicker">YouthLens · 資料層預覽</p>
  <h1 id="title">新北市青年統計</h1>
  <p class="sub">
    這是 <code style="font-family:var(--mono)">unified.json</code> 的內容，也就是資料層要交給前端的東西。
    每個數字都可以點開看它從哪來、怎麼算的。
  </p>
  <p class="srcline" id="srcline"></p>
</header>

<div class="filters">
  <div class="field">
    <label for="area">地區</label>
    <select id="area"></select>
  </div>
  <div class="field">
    <label id="bandlabel">年齡層</label>
    <div class="chips" id="bands" role="group" aria-labelledby="bandlabel"></div>
  </div>
</div>

<div class="tiles" id="tiles"></div>
<p class="scopenote" id="scopenote"></p>

<section>
  <h2 id="ranktitle">各行政區排行</h2>
  <p class="hint" id="rankhint"></p>
  <div class="ranks" id="ranks"></div>
</section>

<section>
  <h2>這個地區的全部數字</h2>
  <p class="hint">點任一列，下面會顯示那個數字的來源與算法。</p>
  <div class="tablewrap">
    <table>
      <thead><tr><th>年齡層</th><th>指標</th><th class="num">數值</th><th>單位</th><th>可靠程度</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</section>

<section>
  <div class="prov" id="prov">
    <h3 id="provtitle">資料履歷</h3>
    <p class="headline" id="provvalue"></p>
    <dl id="provlist"></dl>
  </div>
</section>

<p class="foot" id="foot"></p>
</div>

<script id="payload" type="application/json">/*__DATA__*/</script>
<script>
(function () {
  var DATA = JSON.parse(document.getElementById('payload').textContent);
  var R = DATA.records, M = DATA.meta;

  var areas = [], seen = {};
  R.forEach(function (r) { if (!seen[r.region]) { seen[r.region] = 1; areas.push(r.region); } });
  var bands = M.age_groups;
  var METRICS = M.metrics;

  var state = { area: areas[0], band: bands[bands.length - 1], selected: null };

  var $ = function (id) { return document.getElementById(id); };

  function fmt(rec) {
    if (rec.unit === '%') return (rec.value * 100).toFixed(1) + '%';
    return Math.round(rec.value).toLocaleString('en-US');
  }
  function unitOf(rec) { return rec.unit === '%' ? '' : rec.unit; }

  function find(area, band, metric) {
    for (var i = 0; i < R.length; i++) {
      var r = R[i];
      if (r.region === area && r.age_group === band && r.metric === metric) return r;
    }
    return null;
  }

  // ── 篩選器
  var sel = $('area');
  areas.forEach(function (a) {
    var o = document.createElement('option');
    o.value = a; o.textContent = a === M.region ? a + '（全市合計）' : a.replace(M.region, '');
    sel.appendChild(o);
  });
  sel.value = state.area;
  sel.addEventListener('change', function () { state.area = sel.value; render(); });

  bands.forEach(function (b) {
    var btn = document.createElement('button');
    btn.className = 'chip'; btn.type = 'button'; btn.textContent = b + ' 歲';
    btn.addEventListener('click', function () { state.band = b; render(); });
    btn.dataset.band = b;
    $('bands').appendChild(btn);
  });

  // ── 卡片
  function renderTiles() {
    var host = $('tiles'); host.innerHTML = '';
    METRICS.forEach(function (m) {
      var rec = find(state.area, state.band, m);
      if (!rec) return;
      var b = document.createElement('button');
      b.className = 'tile'; b.type = 'button';
      b.innerHTML =
        '<span class="tile-label">' + m +
        '<span class="pill ' + rec.provenance.confidence + '">' + rec.provenance.confidence + '</span></span>' +
        '<span class="tile-value">' + fmt(rec) +
        '<span class="tile-unit">' + unitOf(rec) + '</span></span>' +
        '<span class="tile-hint">點一下看這個數字怎麼來的</span>';
      b.addEventListener('click', function () { select(rec); });
      host.appendChild(b);
    });
  }

  // ── 排行
  function renderRanks() {
    var metric = '人口數';
    var list = R.filter(function (r) {
      return r.age_group === state.band && r.metric === metric && r.region !== M.region;
    }).sort(function (a, b) { return b.value - a.value; });

    $('ranktitle').textContent = '各行政區排行 · ' + state.band + ' 歲' + metric;
    $('rankhint').textContent = '共 ' + list.length + ' 個行政區，依' + metric +
      '排序。點一下切換到該區。目前選的是「' + state.area.replace(M.region, '') + '」。';

    var max = list.length ? list[0].value : 1;
    var host = $('ranks'); host.innerHTML = '';
    list.forEach(function (r) {
      var b = document.createElement('button');
      b.className = 'rank'; b.type = 'button';
      if (r.region === state.area) b.dataset.current = '1';
      b.innerHTML =
        '<span class="rank-name">' + r.region.replace(M.region, '') + '</span>' +
        '<span class="rank-bar"><span class="rank-fill" style="width:' +
        (r.value / max * 100).toFixed(1) + '%"></span></span>' +
        '<span class="rank-val">' + fmt(r) + '</span>';
      b.addEventListener('click', function () {
        state.area = r.region; sel.value = r.region; render();
      });
      host.appendChild(b);
    });
  }

  // ── 表
  function renderRows() {
    var host = $('rows'); host.innerHTML = '';
    bands.forEach(function (bd) {
      METRICS.forEach(function (m) {
        var rec = find(state.area, bd, m);
        if (!rec) return;
        var tr = document.createElement('tr');
        tr.innerHTML =
          '<td>' + bd + ' 歲</td><td>' + m + '</td>' +
          '<td class="num">' + fmt(rec) + '</td><td>' + rec.unit + '</td>' +
          '<td><span class="pill ' + rec.provenance.confidence + '">' +
          rec.provenance.confidence + '</span></td>';
        tr.addEventListener('click', function () { select(rec); });
        host.appendChild(tr);
      });
    });
  }

  // ── 履歷
  var LABELS = {
    source_agency: '來源機關', source_dataset: '來源資料集', source_age_group: '原始分組',
    method: '使用方法', weight: '權重', confidence: '可靠程度', note: '計算說明'
  };
  var METHOD_ZH = {
    exact_match: 'exact_match（分組直接對上，未插補）',
    formula_a_t1: 'formula_a_t1（按人頭切）',
    formula_b_t2: 'formula_b_t2（按真的在勞動市場的人切）',
    formula_c: 'formula_c（分子分母分開切）',
    formula_d_t3: 'formula_d_t3（借全國形狀校準）',
    llm_inferred: 'llm_inferred（AI 判讀年齡描述）'
  };

  function select(rec) {
    state.selected = rec;
    $('provtitle').textContent = rec.region + '　' + rec.age_group + ' 歲　' + rec.metric;
    $('provvalue').textContent = fmt(rec) + ' ' + unitOf(rec);
    var dl = $('provlist'); dl.innerHTML = '';
    Object.keys(LABELS).forEach(function (k) {
      var v = rec.provenance[k];
      if (v === undefined || v === null || v === '') return;
      if (k === 'method') v = METHOD_ZH[v] || v;
      var dt = document.createElement('dt'); dt.textContent = LABELS[k];
      var dd = document.createElement('dd'); dd.textContent = v;
      if (k === 'weight') dd.className = 'mono';
      dl.appendChild(dt); dl.appendChild(dd);
    });
    document.querySelectorAll('#rows tr').forEach(function (tr) { tr.style.background = ''; });
  }

  function render() {
    $('title').textContent = state.area === M.region
      ? M.region + '青年統計' : state.area + '　青年統計';
    document.querySelectorAll('.chip').forEach(function (c) {
      c.setAttribute('aria-pressed', c.dataset.band === state.band ? 'true' : 'false');
    });
    renderTiles(); renderRanks(); renderRows();

    var missing = METRICS.filter(function (m) { return !find(state.area, state.band, m); });
    var note = $('scopenote');
    note.hidden = missing.length === 0;
    note.textContent = missing.length
      ? '就業與薪資只有縣市層級的官方統計，沒有行政區細分，所以這一區看不到：'
        + missing.join('、') + '。切到「' + M.region + '（全市合計）」就看得到。'
      : '';
    var keep = state.selected;
    select(keep && find(state.area, keep.age_group, keep.metric) || find(state.area, state.band, METRICS[0]));
  }

  $('srcline').innerHTML = M.sources.map(function (s) {
    return s.agency + '「' + s.dataset + '」';
  }).join('　·　') + '　·　' + M.period_label;

  $('foot').innerHTML =
    '共 ' + R.length.toLocaleString('en-US') + ' 筆記錄，' + M.areas + ' 個地區 × ' +
    M.age_groups.length + ' 個年齡層 × ' + METRICS.length + ' 個指標。' +
    '產生於 ' + DATA._generated + '，格式為 ' + DATA._schema + '。' +
    ' 這頁是資料層的預覽，不是最終儀表板 —— 最終介面由前端負責。';

  render();
})();
</script>
